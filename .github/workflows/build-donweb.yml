name: Preparar DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar JavaScript
        run: npm run check

      - name: Construir paquete para Ferozo
        run: npm run build:donweb

      - name: Publicar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: repuestos-donweb
          path: output/donweb/
          if-no-files-found: error

      - name: Actualizar rama para DonWeb
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          deploy_dir="$(mktemp -d)"
          cp -R output/donweb/repuestos/. "$deploy_dir/"
          git -C "$deploy_dir" init -b donweb
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add .
          git -C "$deploy_dir" commit -m "Deploy ${SHA}"
          git -C "$deploy_dir" remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$deploy_dir" push --force origin donweb
